name: flutter_family_tracker
description: "A cross-platform real-time Family Tracker application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_database: ^11.0.4
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  battery_plus: ^6.0.3
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  pinput: ^5.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
